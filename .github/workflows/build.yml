name: Build Tauri Binaries

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.ref_type == 'branch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Prefetch WiX Toolset (Windows)
        # The Tauri bundler downloads WiX from GitHub in a single attempt, which
        # often times out (HTTP 504). Fetch it with retries into the folder the
        # bundler checks first, so the MSI step finds it already in place.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:LOCALAPPDATA "tauri\WixTools314"
          $zip = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          New-Item -ItemType Directory -Force $dest | Out-Null
          curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o $zip `
            https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31") {
            throw "WiX download hash mismatch: $hash"
          }
          Expand-Archive $zip -DestinationPath $dest -Force

      - name: Install Dependencies
        run: npm ci

      - name: Build Tauri App
        # Retry so a transient download failure while bundling (e.g. NSIS) does
        # not fail the job; Cargo output is reused, so retries only re-bundle.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm run tauri build && exit 0
            echo "tauri build failed (attempt $attempt), retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Upload Bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundles-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**

  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Prefetch WiX Toolset (Windows)
        # The Tauri bundler downloads WiX from GitHub in a single attempt, which
        # often times out (HTTP 504). Fetch it with retries into the folder the
        # bundler checks first, so the MSI step finds it already in place.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:LOCALAPPDATA "tauri\WixTools314"
          $zip = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          New-Item -ItemType Directory -Force $dest | Out-Null
          curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o $zip `
            https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31") {
            throw "WiX download hash mismatch: $hash"
          }
          Expand-Archive $zip -DestinationPath $dest -Force

      - name: Install Dependencies
        run: npm ci

      - name: Build and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FFmpeg Studio ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
