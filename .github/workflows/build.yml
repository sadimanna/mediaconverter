name: Build Tauri Binaries

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.ref_type == 'branch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Dependencies
        run: npm ci

      - name: Prefetch WiX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Tauri downloads WiX from GitHub releases at bundle time, which has been
          # failing with 5xx errors. Put it where Tauri looks so it skips the download.
          $dest = Join-Path $env:LOCALAPPDATA 'tauri\WixTools314'
          if (Test-Path $dest) { exit 0 }
          $zip = Join-Path $env:RUNNER_TEMP 'wix.zip'
          $ok = $false
          foreach ($i in 1..5) {
            try {
              Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
              $ok = $true; break
            } catch { Write-Host "GitHub download failed (attempt $i): $_"; Start-Sleep -Seconds 20 }
          }
          if ($ok) {
            Expand-Archive $zip -DestinationPath $dest
          } else {
            Write-Host 'Falling back to the WiX 3.14.1 package on nuget.org'
            $pkg = Join-Path $env:RUNNER_TEMP 'wix-nuget.zip'
            Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/wix/3.14.1/wix.3.14.1.nupkg' -OutFile $pkg
            Expand-Archive $pkg -DestinationPath (Join-Path $env:RUNNER_TEMP 'wix-nuget')
            New-Item -ItemType Directory -Force $dest | Out-Null
            Copy-Item (Join-Path $env:RUNNER_TEMP 'wix-nuget\tools\*') $dest -Recurse
          }
          if (-not (Test-Path (Join-Path $dest 'candle.exe'))) { throw 'WiX prefetch did not produce candle.exe' }

      - name: Build Tauri App
        shell: bash
        run: |
          # Retry: bundling downloads NSIS tools from GitHub, which can return 5xx.
          for attempt in 1 2 3; do
            npm run tauri build && exit 0
            echo "Build attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Upload Bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundles-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**

  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Dependencies
        run: npm ci

      - name: Prefetch WiX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Tauri downloads WiX from GitHub releases at bundle time, which has been
          # failing with 5xx errors. Put it where Tauri looks so it skips the download.
          $dest = Join-Path $env:LOCALAPPDATA 'tauri\WixTools314'
          if (Test-Path $dest) { exit 0 }
          $zip = Join-Path $env:RUNNER_TEMP 'wix.zip'
          $ok = $false
          foreach ($i in 1..5) {
            try {
              Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
              $ok = $true; break
            } catch { Write-Host "GitHub download failed (attempt $i): $_"; Start-Sleep -Seconds 20 }
          }
          if ($ok) {
            Expand-Archive $zip -DestinationPath $dest
          } else {
            Write-Host 'Falling back to the WiX 3.14.1 package on nuget.org'
            $pkg = Join-Path $env:RUNNER_TEMP 'wix-nuget.zip'
            Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/wix/3.14.1/wix.3.14.1.nupkg' -OutFile $pkg
            Expand-Archive $pkg -DestinationPath (Join-Path $env:RUNNER_TEMP 'wix-nuget')
            New-Item -ItemType Directory -Force $dest | Out-Null
            Copy-Item (Join-Path $env:RUNNER_TEMP 'wix-nuget\tools\*') $dest -Recurse
          }
          if (-not (Test-Path (Join-Path $dest 'candle.exe'))) { throw 'WiX prefetch did not produce candle.exe' }

      - name: Build and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FFmpeg Studio ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
