[package]
name = "ffmpeg-gui"
version = "1.1.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
csv = "1.3"
tauri-plugin-dialog = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
